<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conduit</title>
    <!-- conduit:appearance-boot -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: var(--c-boot-bg);
        transition: opacity 0.4s ease;
      }
      #splash img {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
      }
      #splash .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid transparent;
        border-radius: 50%;
        border-top-color: var(--c-boot-fg);
        border-right-color: var(--c-boot-fg);
        animation: spin 0.8s linear infinite;
      }
      .splash-fade-out { opacity: 0 !important; pointer-events: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/app-icon.png" alt="" />
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
